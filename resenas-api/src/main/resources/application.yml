server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resenas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate          # el esquema lo crea Flyway, no Hibernate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false   # fechas en ISO-8601

app:
  # Orígenes permitidos para CORS (separados por comas). Admite comodines.
  # En producción: el dominio de Vercel + los previews + tu dominio propio.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://*.vercel.app}

  # Seguridad (login de moderación + firma del JWT)
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    # Hash BCrypt. Por defecto corresponde a la contraseña "admin1234" (CÁMBIALA en producción).
    admin-password-hash: ${ADMIN_PASSWORD_HASH:$2b$10$41pME10fefMB4VtQ0WYnOOyYX2RzpazBahhOkzRNJvTS0kvlN/2WK}
    # Secreto HMAC (mínimo 32 bytes). En producción genera uno fuerte: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:cambia-este-secreto-de-desarrollo-min-32-bytes-1234567890}
    jwt-ttl-seconds: ${JWT_TTL_SECONDS:3600}
